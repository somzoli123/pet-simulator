<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="love-always-wins.png">
  <title>Nevelj Cicát!</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #fff7ef;
      --card: #fff;
      --tx: #3b2f2a;
      --mut: #8a7a70;
      --ac: #e8803a;
      --line: #f0e1d3;
      --bar: #f3e6da;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1e1a18;
        --card: #2a2522;
        --tx: #f3e9e1;
        --mut: #a89a90;
        --line: #3d3531;
        --bar: #3a322e;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #1e1a18;
      --card: #2a2522;
      --tx: #f3e9e1;
      --mut: #a89a90;
      --line: #3d3531;
      --bar: #3a322e;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.4 system-ui, sans-serif;
      min-height: 100vh
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px
    }

    h1 {
      font-size: 20px;
      margin: 4px 0 10px;
      text-align: center
    }

    .stage {
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(var(--bar), var(--card))
    }

    .stage svg,
    .stage img.skin {
      width: 210px;
      height: 210px
    }

    .stage img.skin {
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--ac)
    }

    .stage svg,
    #edw svg {
      image-rendering: pixelated
    }

    .dead {
      filter: grayscale(1)
    }

    .dead .cat {
      animation: none
    }

    .cat {
      animation: idle 3s ease-in-out infinite
    }

    @keyframes idle {
      50% {
        transform: translateY(-4px)
      }
    }

    .a-play .cat {
      animation: hop .5s 4
    }

    .a-pet .cat {
      animation: wig .4s 5
    }

    .a-feed .cat,
    .a-drink .cat {
      animation: nom .35s 5
    }

    .a-sleep .cat {
      animation: idle 1s 2
    }

    @keyframes hop {
      50% {
        transform: translateY(-40px)
      }
    }

    @keyframes wig {
      25% {
        transform: rotate(-5deg)
      }

      75% {
        transform: rotate(5deg)
      }
    }

    @keyframes nom {
      50% {
        transform: scale(1.06, .94)
      }
    }

    .fl {
      position: absolute;
      font-size: 28px;
      animation: up 1.6s forwards;
      pointer-events: none
    }

    @keyframes up {
      to {
        transform: translateY(-170px);
        opacity: 0
      }
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 14px
    }

    .bar span {
      width: 92px
    }

    .bar i {
      flex: 1;
      height: 12px;
      background: var(--bar);
      border-radius: 8px;
      overflow: hidden
    }

    .bar b {
      display: block;
      height: 100%;
      border-radius: 8px;
      transition: width .6s
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    button {
      font: inherit;
      color: var(--tx);
      background: var(--bar);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer
    }

    button:active {
      transform: scale(.96)
    }

    button.p {
      background: var(--ac);
      color: #fff;
      border: 0;
      font-weight: 600
    }

    input[type=text] {
      font: inherit;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--tx)
    }

    .sw {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0
    }

    .sw u {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      display: block
    }

    .sw u.on {
      border-color: var(--ac)
    }

    .log {
      font-size: 13px;
      color: var(--mut)
    }

    .log div {
      padding: 2px 0
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--mut)
    }

    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 4px
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row>* {
      flex: 1
    }

    small {
      color: var(--mut)
    }

    .skins {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0
    }

    .skins img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid transparent;
      cursor: pointer
    }

    .skins img.on {
      border-color: var(--ac)
    }

    #edw .cat {
      animation: none
    }

    #edw>div>svg {
      width: 100%;
      height: auto;
      display: block
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="card">Betöltés…</div>
  </div>
  <script>
    const COL = { narancs: '#f0a04b', szürke: '#9aa0a6', fekete: '#3a3d42', fehér: '#f6f2ec', krém: '#e8d3a9', kékes: '#8fa8c8' };
    const ACC = ['', '🎩', '🎀', '👑', '🕶️'];
    const RATE = { h: 1.2, t: 1.6, j: 0.8, e: 0.6 };
    const NAMES = { h: '🍗 Étel', t: '💧 Víz', j: '💖 Boldogság', e: '⚡ Energia' };
    const BC = { h: '#e8803a', t: '#4aa3df', j: '#e86a9a', e: '#e8c13a' };
    let db, user, ref, uid, S = null, loaded = false, joined = false, lastAnim = 0, pendingColor = 'narancs', newCat = false;
    const $ = s => document.querySelector(s), app = $('#app');
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const clamp = v => Math.max(0, Math.min(100, v));
    function cur() {
      const m = (Date.now() - S.t) / 60000, r = {}; for (const k in RATE) r[k] = S.s[k] - RATE[k] * m;
      const c = S.dead ? S.cause : r.h < -40 ? 'éhen halt' : r.t < -30 ? 'szomjan halt' : r.j < -60 ? 'bánatában halt meg' : S.ill && Date.now() - S.ill.t > 36e5 ? 'betegségben halt meg' : null;
      return { h: clamp(r.h), t: clamp(r.t), j: clamp(r.j), e: clamp(r.e), raw: r, fat: Math.max(0, (S.fat || 0) - 0.12 * m), dose: Math.max(0, (S.dose || 0) - m / 8), ill: S.ill || null, dead: !!c, cause: c }
    }
    const mix = (h, t) => { const n = parseInt(h.slice(1), 16); return '#' + [16, 8, 0].map(x => Math.round(((n >> x) & 255) * (1 - t) + 255 * t).toString(16).padStart(2, '0')).join('') };
    const mixTo = (a, b, t) => { const p = h => parseInt(h.slice(1), 16), A = p(a), B = p(b); return '#' + [16, 8, 0].map(x => Math.round(((A >> x) & 255) * (1 - t) + ((B >> x) & 255) * t).toString(16).padStart(2, '0')).join('') };
    function pix(color, st, acc) {
      const W = 20, H = 22, OY = 3, g = Array.from({ length: H }, () => Array(W).fill('.'));
      const set = (x, y, c) => { y += OY; if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c }, fill = (y, a, b, c) => { for (let x = a; x <= b; x++)set(x, y, c) }, E = (x, y, c) => { set(x, y, c); set(19 - x, y, c) };
      const f = st.fat >= 75 ? 2 : st.fat >= 40 ? 1 : 0, a = 5 - f, b = 14 + f;
      fill(1, 4, 5, 'B'); fill(1, 14, 15, 'B'); fill(2, 4, 6, 'B'); fill(2, 13, 15, 'B'); set(5, 2, 'p'); set(14, 2, 'p');
      for (let y = 3; y <= 9; y++) { const e = y == 3 || y == 9; fill(y, e ? 4 : 3, e ? 15 : 16, 'B') }
      if (st.dead) { E(5, 5, 'e'); E(7, 5, 'e'); E(6, 6, 'e'); E(5, 7, 'e'); E(7, 7, 'e') }
      else if (st.e < 20) { E(6, 6, 'e'); E(7, 6, 'e') }
      else if (st.j > 70 && !st.ill) { E(5, 6, 'e'); E(6, 5, 'e'); E(7, 6, 'e') }
      else { E(6, 5, 'e'); E(7, 5, 'e'); E(6, 6, 'e'); E(7, 6, 'e'); E(6, 5, 'w') }
      set(9, 7, 'p'); set(10, 7, 'p');
      if (!st.dead && !st.ill && st.j > 70) { set(8, 8, 'm'); set(11, 8, 'm'); set(9, 9, 'm'); set(10, 9, 'm') }
      else if (!st.dead && (st.ill || Math.min(st.h, st.t, st.j) < 25)) { set(9, 8, 'm'); set(10, 8, 'm'); set(8, 9, 'm'); set(11, 9, 'm') }
      else { set(9, 8, 'm'); set(10, 8, 'm') }
      for (let y = 10; y <= 14; y++)fill(y, a, b, 'B');
      for (let y = 11; y <= 14; y++)fill(y, a + 2, b - 2, 'l');
      fill(15, a, a + 2, 'B'); fill(15, b - 2, b, 'B');
      set(b + 1, 14, 'B'); set(b + 2, 14, 'B'); fill(11, b + 2, b + 2, 'B'); set(b + 2, 12, 'B'); set(b + 2, 13, 'B');
      if (st.ill && !st.dead) { set(17, 4, 'u'); set(17, 5, 'u') }
      if (st.dead) fill(0, 7, 12, 'y');
      if (acc == '🎩') { fill(-1, 8, 11, 'k'); fill(0, 8, 11, 'k'); fill(1, 8, 11, 'r'); fill(2, 7, 12, 'k') }
      if (acc == '🎀') { fill(10, 8, 11, 'r'); fill(11, 9, 10, 'r') }
      if (acc == '👑') { [7, 9, 10, 12].forEach(x => set(x, 1, 'y')); fill(2, 7, 12, 'y') }
      if (acc == '🕶️') { fill(5, 5, 8, 'k'); fill(6, 5, 8, 'k'); fill(5, 11, 14, 'k'); fill(6, 11, 14, 'k'); fill(5, 9, 10, 'k') }
      if (acc && acc.length == 440) for (let i = 0; i < 440; i++) { const c = acc[i]; if (c != '.') g[i / 20 | 0][i % 20] = 'c' + c }
      const o = g.map(r => r.slice());
      for (let y = 0; y < H; y++)for (let x = 0; x < W; x++)if (g[y][x] == '.' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => { const v = (g[y + dy] || [])[x + dx]; return v && v != '.' })) o[y][x] = 'o';
      const bc = st.dead ? '#9a9a9a' : st.ill ? mixTo(color, '#8fd16a', .4) : color, P = { B: bc, l: mix(bc, .45), p: st.dead ? '#bbb' : '#f5a9b8', e: '#222', w: '#fff', m: '#222', o: '#2d2230', y: '#ffd23a', k: '#222', r: '#e0405a', u: '#6fc3ff', ...Object.fromEntries(PAL.map((c, i) => ['c' + i.toString(16), c])) };
      let r = ''; for (let y = 0; y < H; y++)for (let x = 0; x < W; x++) { const c = o[y][x]; if (c != '.') r += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${P[c]}"/>` }
      return `<svg viewBox="0 0 ${W} ${H}" class="cat" shape-rendering="crispEdges">${r}</svg>`
    }
    function render() {
      if (!loaded) { return }
      if (newCat && S && !S.dead) newCat = false;
      if (!S || newCat) {
        app.innerHTML = `<h1>🐱 Közös Cica</h1><div class="card"><b>Új cica létrehozása</b><p><small>Neveld fel a cicát, aztán hívj meg egy társat, aki élőben veled együtt gondozza.</small></p><input id="nm" type="text" maxlength="16" placeholder="Cica neve"><div class="sw" id="sw">${Object.entries(COL).map(([k, v]) => `<u data-c="${k}" title="${k}" style="background:${v}" class="${k == pendingColor ? 'on' : ''}"></u>`).join('')}</div><button class="p" style="width:100%" id="mk">Létrehozás</button>${(newCat || !petId) ? '<button style="width:100%;margin-top:8px" id="nc">← Mégse</button>' : ''}</div>`;
        $('#sw').onclick = e => { if (e.target.dataset.c) { pendingColor = e.target.dataset.c; document.querySelectorAll('#sw u').forEach(u => u.classList.toggle('on', u.dataset.c == pendingColor)) } };
        const nc = $('#nc'); if (nc) nc.onclick = () => { newCat = false; if (!S) listView(); else render() };
        $('#mk').onclick = () => { const w = newCat && S; newCat = false; ref.set({ name: $('#nm').value.trim() || 'Cirmi', color: pendingColor, skin: null, fat: 0, skins: [], acc: 0, ...(w ? { owner: S.owner, partner: S.partner, pn: S.pn } : { owner: uid, partner: null, pn: { o: me } }), t: Date.now(), s: { h: 80, t: 80, j: 80, e: 80 }, log: [{ w: (w && uid !== S.owner) ? 'p' : 'o', x: 'létrehozta a cicát', t: Date.now() }], anim: null, made: Date.now() }) };
        return
      }
      const role = uid === S.owner ? 'o' : uid === S.partner ? 'p' : null;
      if (!role) {

        app.innerHTML = `<h1>🐱 ${esc(S.name)}</h1><div class="card">Ennek a cicának már van két gondozója, ezért a hely betelt. 😿</div>`; return
      }
      const st = cur(), anim = S.anim && Date.now() - S.anim.t < 3000 ? S.anim : null; wasDead = st.dead; wasIll = st.ill ? st.ill.n : '';
      const other = role == 'o' ? (S.partner ? 'Társ' : null) : 'Gazdi';
      app.innerHTML = `<h1>🐱 ${esc(S.name)}</h1>
  <div class="top"><span><span class="dot"></span><u id="bk" style="cursor:pointer">← Cicáim</u> • ${esc(me)} • ${role == 'o' ? 'gazdi' : 'társ'} • <u id="lo" style="cursor:pointer">kilépés</u></span><span>${S.partner ? '2/2 gondozó' : '1/2 gondozó'}</span></div>
  <div class="card"><div class="stage ${st.dead ? 'dead' : anim ? 'a-' + anim.k : ''}" id="stage">${S.skin ? `<img class="skin cat" src="${S.skin}">${ACC[S.acc] ? `<span style="position:absolute;top:8px;font-size:38px">${ACC[S.acc]}</span>` : ''}` : pix(COL[S.color] || COL.narancs, st, accOf(S.acc))}</div>
  ${st.dead ? '' : '<div style="text-align:center;margin:6px 0"><small>🤚 Simogasd: húzd az ujjad (egérrel nyomd le és húzd) a cicán!</small></div>'}<div id="bars">${bars(st)}</div></div>
  ${st.dead ? `<div class="card" style="text-align:center"><b>🪦 ${esc(S.name)} ${esc(st.cause)}.</b><br><br><button class="p" id="rev">🐣 Új cica</button></div>` : `<div class="card"><div class="btns"><button data-a="feed">🍗 Etet</button><button data-a="drink">💧 Itat</button><button data-a="play">🧶 Játék</button><button data-a="sleep">😴 Altat</button><button data-a="acc">🎩 Kellék</button><button data-a="med">💊 Gyógyszer</button></div></div>`}
  ${!S.partner && role == 'o' ? `<div class="card"><b>Meghívó</b><p><small>Küldd el ezt a linket egy embernek. Az első, aki megnyitja és belép (regisztrál), lesz a társ gondozó.</small></p><button class="p" id="inv" style="width:100%">🔗 Link másolása</button></div>` : ''}
  ${edCard()}<div class="card"><b>Megjelenés</b><div class="row" style="margin:8px 0"><input id="rn" type="text" maxlength="16" value="${esc(S.name)}"><button id="rb" style="flex:0 0 90px">Átnevez</button></div>
  <div class="sw" id="sw">${Object.entries(COL).map(([k, v]) => `<u data-c="${k}" title="${k}" style="background:${v}" class="${!S.skin && k == S.color ? 'on' : ''}"></u>`).join('')}</div>
  <div class="skins" id="skins">${(S.skins || []).map((u, i) => `<img src="${u}" data-i="${i}" class="${S.skin == u ? 'on' : ''}">`).join('')}</div>
  <button id="up" style="width:100%">📷 Saját cicakép feltöltése</button><input id="f" type="file" accept="image/*" hidden></div>
  <div class="card log"><b style="color:var(--tx)">Napló</b>${S.log.map(l => `<div>${l.w == role ? 'Te' : nmOf(l.w)} ${esc(l.x)} <small>(${new Date(l.t).toLocaleTimeString('hu', { hour: '2-digit', minute: '2-digit' })})</small></div>`).join('')}</div>`;
      if (anim && anim.t !== lastAnim) { lastAnim = anim.t; fly({ feed: '🍗', drink: '💧', pet: '💗', play: '🧶', sleep: '💤', acc: '✨', med: '💊' }[anim.k]) }
      const bt = app.querySelector('.btns'); if (bt) bt.onclick = e => { const a = e.target.dataset.a; if (a) act(a, role) }; const lo = $('#lo'); if (lo) lo.onclick = logout; const bk = $('#bk'); if (bk) bk.onclick = listView; wireEd(); wirePet(role); const rv = $('#rev'); if (rv) rv.onclick = revive;
      $('#sw').onclick = e => { const c = e.target.dataset.c; if (c) ref.update({ color: c, skin: null }) };
      $('#rb').onclick = () => { const n = $('#rn').value.trim(); if (n) ref.update({ name: n }) };
      $('#skins').onclick = e => { const i = e.target.dataset.i; if (i != null) ref.update({ skin: S.skins[i] }) };
      $('#up').onclick = () => $('#f').click();
      $('#f').onchange = e => upload(e.target.files[0]);
      const inv = $('#inv'); if (inv) inv.onclick = async () => { try { await navigator.clipboard.writeText(location.origin + location.pathname + '?join=' + S.code); inv.textContent = '✅ Kimásolva!' } catch { prompt('Másold ki a linket:', location.origin + location.pathname + '?join=' + S.code) } };
    }
    function bars0(st) { const f = st.fat >= 75 ? '🐷 Kövér!' : st.fat >= 40 ? '😸 Dundi' : '😺 Karcsú'; return Object.keys(RATE).map(k => `<div class="bar"><span>${NAMES[k]}</span><i><b style="width:${st[k]}%;background:${BC[k]}"></b></i></div>`).join('') + `<div class="bar"><span>Alkat</span>${f}${st.fat >= 75 ? ' <small>– ne etesd tovább, veszélyes!</small>' : ''}</div>` }
    function fly(e, n = 4) { const s = $('#stage'); if (!s) return; for (let i = 0; i < n; i++) { const f = document.createElement('span'); f.className = 'fl'; f.textContent = e; f.style.left = (25 + Math.random() * 50) + '%'; f.style.top = '60%'; f.style.animationDelay = i * .25 + 's'; s.appendChild(f) } }
    function act(k, role) {
      const st = cur(); if (st.dead) return;
      const s = { ...st.raw }, T = { feed: 'etette a cicát', drink: 'megitatta a cicát', pet: 'megsimogatta a cicát', play: 'játszott a cicával', sleep: 'lefektette a cicát', acc: 'új kellékkel dobta fel a cicát', med: S.ill ? 'gyógyszert adott a cicának 💊' : 'felesleges gyógyszert adott a cicának 💊' };
      let fat = st.fat, txt = T[k], ill = S.ill ? { ...S.ill } : null, dose = st.dose, cause = null, cured = false;
      if (k == 'feed') { if (s.h >= 90) { fat += 14; txt = 'túletette a cicát 🍔' } s.h = Math.min(130, s.h + 30) }
      if (k == 'drink') s.t = Math.min(100, s.t + 35);
      if (k == 'pet') s.j = Math.min(100, s.j + 18);
      if (k == 'play') { s.j = Math.min(100, s.j + 25); s.e -= 15; s.h -= 8; fat = Math.max(0, fat - 10) }
      if (k == 'sleep') s.e = Math.min(100, s.e + 40);
      if (k == 'med') { dose += 1; if (dose > 3) cause = 'túladagolásban halt meg'; else if (ill) { ill.p = (ill.p || 0) + 1; if (ill.p >= ill.need) { ill = null; cured = true } } }
      s.e = Math.max(0, s.e);
      if (fat >= 100) cause = 'túlevésbe halt bele';
      const now = Date.now(), log = [{ w: role, x: txt, t: now }, ...S.log];
      if (cured) log.unshift({ w: role, x: '– a cica meggyógyult ✅', t: now });
      if (cause) log.unshift({ w: role, x: '– a cica ' + cause + ' 🪦', t: now });
      ref.update({ s, t: now, fat, dose, ill, ...(cured ? { lastIll: now } : {}), acc: k == 'acc' ? (S.acc + 1) % (ACC.length + (S.custom || []).length) : S.acc, anim: { k, t: now }, log: log.slice(0, 8), ...(cause ? { dead: true, cause } : {}) });
    }
    function revive() { newCat = true; render() }
    function medInfo(st) {
      let h = '';

    function wireEd() {

    }
    const SUPABASE_URL = 'https://jnieiubuwyyomrurereu.supabase.co', SUPABASE_ANON_KEY = 'sb_publishable_0RrDqOd1caMyC66xzDvoHQ_KJ4ZV9PC';
    let sb = null, petId = null, chan = null, me = '', names = {}, pendingJoin = new URLSearchParams(location.search).get('join');
    const nmOf = w => (S && S.pn && S.pn[w]) || (w == 'o' ? 'Gazdi' : 'Társ');
    async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('') }

    function authView(msg) {
